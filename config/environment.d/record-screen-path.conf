# Prepends the user proxy directory and user binaries to PATH so Hyprland /
# Quickshell menu and bar calls resolve record-screen / the
# omarchy-capture-screenrecording proxy (which redirects to wf-recorder
# instead of gpu-screen-recorder, that crashes the GPU / VCE encoder).
PATH=${HOME}/.config/omarchy/bin:${HOME}/.local/bin:${PATH}